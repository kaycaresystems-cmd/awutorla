name: Deploy Supabase

# Pushes the DB migration and deploys all 4 edge functions to the linked Supabase
# project. Runs on every push to main that touches supabase/, plus manual dispatch
# for re-running after fixing secrets or a failed step.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - personal access token, supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    - project ref (Project Settings -> General -> Reference ID)
#   SUPABASE_DB_PASSWORD   - the database password set when the project was created
#
# Hubtel SMS credentials (HUBTEL_CLIENT_ID / HUBTEL_CLIENT_SECRET / HUBTEL_SENDER_ID)
# are NOT set here - those are Supabase project secrets (edge function runtime env),
# set once via `supabase secrets set` or the dashboard, not per-deploy.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # create-walkin-client and create-staff-account verify the caller's JWT
      # themselves (must be a signed-in tailor/admin), so they deploy with the
      # default JWT verification left on.
      - name: Deploy create-walkin-client
        run: supabase functions deploy create-walkin-client

      - name: Deploy create-staff-account
        run: supabase functions deploy create-staff-account

      # track-order and resend-access-code are called by anonymous/logged-out
      # visitors (public tracking links, lost-code recovery), so they must skip
      # Supabase's platform-level JWT check and do their own authorization inside.
      - name: Deploy track-order
        run: supabase functions deploy track-order --no-verify-jwt

      - name: Deploy resend-access-code
        run: supabase functions deploy resend-access-code --no-verify-jwt
